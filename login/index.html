<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>登录 · EdgeTunnel</title>
  <link rel="stylesheet" href="https://nohello-ai.github.io/edt-pages-pro/css/base.css">
  <link rel="stylesheet" href="https://nohello-ai.github.io/edt-pages-pro/css/pages.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand-row">
        <div class="brand-mark">ET</div>
        <h1>后台登录</h1>
      </div>
      <p class="lead">仅需管理员密码（环境变量 <strong>ADMIN</strong> / PASSWORD / TOKEN），无需用户名。</p>
      <form id="loginForm" novalidate>
        <div class="login-field">
          <span class="mdi-like" aria-hidden="true">🔒</span>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="密码">
        </div>
        <button class="login-submit" type="submit" id="loginBtn">立即登录</button>
        <div id="errorMsg" class="login-error"></div>
      </form>
      <p class="login-foot">EdgeTunnel · Worker 管理台</p>
    </div>
  </div>
  <script type="module" src="https://nohello-ai.github.io/edt-pages-pro/js/login.js"></script>
</body>
</html>
