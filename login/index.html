<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>登录 · EdgeTunnel</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <iframe class="login-bg-frame" src="/" title="background"></iframe>
  <div class="login-dim"></div>
  <div class="center-page">
    <div class="glass-card">
      <div class="icon">ET</div>
      <h1>登录管理台</h1>
      <p class="lead">使用环境变量 <strong>ADMIN</strong>（或 PASSWORD / TOKEN）对应的口令登录。</p>
      <form id="loginForm" class="field" style="gap:12px">
        <div class="field">
          <label for="password">管理员密码</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
        <div id="errorMsg" class="muted" style="color:var(--danger);min-height:1.2em;font-size:13px"></div>
      </form>
      <div class="foot">配合 edgetunnel-v3 Worker · 同源 API</div>
    </div>
  </div>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
