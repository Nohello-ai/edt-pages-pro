name: Build ARM64 Kernel for DroidVM

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux kernel version (e.g., 6.12.8)'
        required: true
        default: '6.12.8'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            crossbuild-essential-arm64 libelf-dev dwarves ccache

      # ---------- 源码缓存 ----------
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: linux-*
          key: kernel-src-${{ github.event.inputs.kernel_version }}
          restore-keys: |
            kernel-src-${{ github.event.inputs.kernel_version }}

      # ---------- ccache 缓存 ----------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-droidvm-${{ github.event.inputs.kernel_version }}
          restore-keys: |
            ccache-droidvm-
          save-always: true

      # ---------- 下载源码 ----------
      - name: Download kernel source
        run: |
          KERNEL_VERSION=${{ github.event.inputs.kernel_version }}
          if [ ! -d "linux-${KERNEL_VERSION}" ]; then
            wget -q https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz
            tar -xf linux-${KERNEL_VERSION}.tar.xz
          fi
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV

      # ---------- 配置内核 ----------
      - name: Configure kernel
        run: |
          cd linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          if [ -f "../kernel-config.txt" ]; then
            echo "Applying kernel-config.txt"
            while IFS= read -r line || [ -n "$line" ]; do
              line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              if [[ "$line" =~ ^CONFIG_([^=]+)=(.*)$ ]]; then
                opt="${BASH_REMATCH[1]}"
                val="${BASH_REMATCH[2]}"
                case "$val" in
                  y) ./scripts/config --enable "$opt" ;;
                  m) ./scripts/config --module "$opt" ;;
                  n) ./scripts/config --disable "$opt" ;;
                  *) ./scripts/config --set-str "$opt" "$val" ;;
                esac
              fi
            done < "../kernel-config.txt"
          fi

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== Key config check ==="
          grep "^CONFIG_GUNYAH=y" .config && echo "[OK] GUNYAH" || echo "[FAIL] GUNYAH"
          grep "^CONFIG_VIRTIO_CONSOLE=y" .config && echo "[OK] VIRTIO_CONSOLE" || echo "[FAIL] VIRTIO_CONSOLE"
          grep "^CONFIG_VIRTIO_BLK_MQ=y" .config && echo "[OK] VIRTIO_BLK_MQ" || echo "[FAIL] VIRTIO_BLK_MQ"
          grep "^CONFIG_VIRTIO_NET_MQ=y" .config && echo "[OK] VIRTIO_NET_MQ" || echo "[FAIL] VIRTIO_NET_MQ"
          grep "^CONFIG_TCP_CONG_BBR=y" .config && echo "[OK] BBR" || echo "[FAIL] BBR"

      # ---------- 编译 ----------
      - name: Build kernel
        run: |
          export PATH=/usr/lib/ccache:$PATH
          ccache -M 5G
          ccache -z
          cd linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          mkdir -p ../artifacts

      - name: Show ccache stats
        run: ccache -s

      # ---------- 打包 ----------
      - name: Package artifacts
        run: |
          V=${{ env.KERNEL_VERSION }}
          cp linux-${V}/arch/arm64/boot/Image.gz artifacts/vmlinuz-${V}-droidvm
          cp linux-${V}/vmlinux artifacts/vmlinux-${V}-droidvm.debug
          cp linux-${V}/.config artifacts/config-${V}-droidvm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_VERSION }}
          path: artifacts/

      # ---------- Release ----------
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Kernel ${{ env.KERNEL_VERSION }} (Build ${{ github.run_number }})
          tag_name: v1.${{ github.run_number }}
          files: |
            artifacts/vmlinuz-${{ env.KERNEL_VERSION }}-droidvm
            artifacts/vmlinux-${{ env.KERNEL_VERSION }}-droidvm.debug
            artifacts/config-${{ env.KERNEL_VERSION }}-droidvm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
