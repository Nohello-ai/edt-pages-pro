name: Build ARM64 Kernel for DroidVM with Custom Config

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux kernel version (e.g., 6.6.89)'
        required: true
        default: '6.6.89'
      release_title:
        description: 'Release title (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            crossbuild-essential-arm64 libelf-dev dwarves ccache

      - name: Cache kernel source
        uses: actions/cache@v3
        with:
          path: linux-*
          key: kernel-src-${{ github.event.inputs.kernel_version }}
          restore-keys: |
            kernel-src-${{ github.event.inputs.kernel_version }}

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.kernel_version }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.kernel_version }}-
            ccache-

      - name: Download kernel source (if not cached)
        run: |
          KERNEL_VERSION=${{ github.event.inputs.kernel_version }}
          if [ ! -d "linux-${KERNEL_VERSION}" ]; then
            wget https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz
            tar -xf linux-${KERNEL_VERSION}.tar.xz
          fi
          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=kernel-${KERNEL_VERSION}" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          cd linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          CONFIG_FILE="../kernel-config.txt"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Applying custom config options from $CONFIG_FILE"
            while IFS= read -r line; do
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              if [[ "$line" =~ ^CONFIG_([^=]+)=(.*)$ ]]; then
                option="${BASH_REMATCH[1]}"
                value="${BASH_REMATCH[2]}"
                if [[ "$value" == "y" ]]; then
                  scripts/config --enable "$option"
                elif [[ "$value" == "m" ]]; then
                  scripts/config --module "$option"
                elif [[ "$value" == "n" ]]; then
                  scripts/config --disable "$option"
                else
                  scripts/config --set-str "$option" "$value"
                fi
              fi
            done < "$CONFIG_FILE"
          else
            echo "Warning: kernel-config.txt not found. Using defconfig only."
          fi

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel with ccache
        run: |
          export PATH=/usr/lib/ccache:$PATH
          ccache -M 5G
          cd linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          mkdir -p ../artifacts

      - name: Show ccache stats
        run: ccache -s

      - name: Package artifacts (vmlinuz + config only)
        run: |
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          cp linux-${KERNEL_VERSION}/arch/arm64/boot/Image.gz artifacts/vmlinuz-${KERNEL_VERSION}-droidvm
          cp linux-${KERNEL_VERSION}/.config artifacts/config-${KERNEL_VERSION}-droidvm

      - name: Upload artifacts (vmlinuz + config)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_VERSION }}
          path: artifacts/

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.event.inputs.release_title || format('Kernel {0} for DroidVM', env.KERNEL_VERSION) }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          files: |
            artifacts/vmlinuz-${{ env.KERNEL_VERSION }}-droidvm
            artifacts/config-${{ env.KERNEL_VERSION }}-droidvm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
