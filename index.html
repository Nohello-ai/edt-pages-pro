<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>喵呜小站</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>
<body>
  <div class="meow-page">
    <div class="meow-card">
      <button type="button" class="cat-btn" id="cat" title="戳戳小猫" aria-label="摸摸小猫">🐱</button>
      <div class="muted" id="meowBubble" style="min-height:1.4em;color:#ff5d8f;font-weight:600">喵~</div>
      <h1>喵呜小站上线啦</h1>
      <p class="sub">今天也是元气满满的一天～ 点一点小猫加好运 ✨</p>
      <div class="meow-stats">
        <div class="meow-stat">
          <div class="k">今日点击</div>
          <div class="v" id="todayClicks">0</div>
          <div class="k" id="dateLabel">—</div>
        </div>
        <div class="meow-stat">
          <div class="k">摸摸次数</div>
          <div class="v" id="petCount">0</div>
          <div class="k">累计撸猫</div>
        </div>
      </div>
      <p class="meow-tip">今日点击按天重置，数据仅存在本机浏览器。</p>
    </div>
  </div>
  <script type="module" src="./js/camouflage.js"></script>
</body>
</html>
