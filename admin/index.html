<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>EdgeTunnel 管理台</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" aria-label="导航">
      <div class="brand">
        <div class="brand-mark">ET</div>
        <div>
          <strong>EdgeTunnel</strong>
          <span>Ivory Console</span>
        </div>
      </div>
      <nav class="nav" id="opsDesktopNav"></nav>
      <div class="sidebar-foot">
        毛玻璃卡片 · 模块化功能<br>
        <span class="badge ok">订阅优先</span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">节点订阅</h1>
          <p id="pageSub">登录后默认进入订阅提取</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn" id="btnReload">刷新</button>
          <button type="button" class="btn btn-danger" id="btnReset">重置配置</button>
          <button type="button" class="btn btn-primary" id="btnLogout">退出登录</button>
        </div>
      </div>
      <div id="viewRoot" class="view active"></div>
    </main>
  </div>

  <nav class="mobile-nav" id="opsMobileNav" aria-label="移动导航"></nav>

  <script type="module" src="../js/admin/app.js"></script>
</body>
</html>
